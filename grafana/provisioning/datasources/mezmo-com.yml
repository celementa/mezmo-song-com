apiVersion: 1

datasources:
  - name: mezmo-com
    uid: mezmo-com
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    jsonData:
      # Grafana читает боевую SQLite .com напрямую. Пользователь grafana
      # добавлен в группу mezmo-com, файл БД доступен только на чтение.
      path: /opt/mezmo-com/data/mezmo.db
