<!doctype html>

    <meta charset="UTF-8" />

    <!-- Язык (src/lib/lang.ts): английская версия под /en. Заход на /, /config или
         /create без префикса уводим на /en, если человек раньше смотрел английскую
         версию или, без сохранённого выбора, если язык браузера не русский. Решается
         до загрузки SPA, чтобы не мигала чужая версия. -->
    <script>(function(){try{var p=location.pathname;if(p!=='/'&&p!=='/config'&&p!=='/create')return;
    var saved=null;try{saved=localStorage.getItem('mezmo:lang')}catch(e){}
    var langs=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||''];
    var ru=/^(ru|uk|be|kk)\b/i.test(langs[0]||'');
    if(saved==='en'||(!saved&&!ru))location.replace('/en'+(p==='/'?'':p)+location.search+location.hash);}catch(e){}})();</script>

    <!-- Согласие на cookie (src/lib/consent.ts): Consent Mode v2 до загрузки GTM.
         Сохранённый выбор из баннера, иначе по умолчанию: ЕС/ЕЭЗ/UK (по часовому
         поясу) — аналитика и реклама выключены до согласия, остальным включены.
         Global Privacy Control всегда выключает рекламу. -->
    <script>(function(){var w=window;w.dataLayer=w.dataLayer||[];w.gtag=function(){w.dataLayer.push(arguments)};
    var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
    var strict=/^(Europe\/|Atlantic\/(Reykjavik|Canary|Madeira|Azores|Faroe))/.test(tz)&&!/^Europe\/(Moscow|Kaliningrad|Samara|Volgograd|Saratov|Ulyanovsk|Astrakhan|Kirov|Simferopol|Minsk|Istanbul)$/.test(tz);
    var gpc=navigator.globalPrivacyControl===true;w.__consentEnv={strict:strict,gpc:gpc};
    var c=null;try{c=JSON.parse(localStorage.getItem('mezmo:consent'))}catch(e){}
    var an=c?!!c.analytics:!strict,ad=(c?!!c.ads:!strict)&&!gpc,g=function(v){return v?'granted':'denied'};
    w.gtag('consent','default',{analytics_storage:g(an),ad_storage:g(ad),ad_user_data:g(ad),ad_personalization:g(ad),wait_for_update:500});})();</script>

    <!-- Google Tag Manager (GTM-KL799LS7; GA4 G-X61MNEQ0GE и пиксели — тегами внутри
         контейнера). Грузится по первому взаимодействию или через 3.5 с, чтобы не
         отнимать полосу у LCP; на localhost не грузится вовсе. -->
    <script>(function(){var h=location.hostname;if(h==='localhost'||h==='127.0.0.1'||h==='::1'||h.endsWith('.local'))return;
    var w=window,d=document,l='dataLayer',i='GTM-KL799LS7';w[l]=w[l]||[];
    var loaded=false,evts=['scroll','pointerdown','touchstart','keydown'],t;
    function load(){if(loaded)return;loaded=true;clearTimeout(t);
      evts.forEach(function(e){w.removeEventListener(e,load)});
      w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName('script')[0],j=d.createElement('script');
      j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i;f.parentNode.insertBefore(j,f);}
    w.__gtmLoad=load; /* форс-загрузка для критичных событий (purchase) */
    evts.forEach(function(e){w.addEventListener(e,load,{once:true,passive:true})});
    t=setTimeout(load,3500);})();</script>
    <!-- End Google Tag Manager -->
