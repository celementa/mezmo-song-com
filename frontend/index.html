    <!-- Google Tag Manager + Яндекс.Метрика — отложенная загрузка (по первому взаимодействию
         или через 3.5с), чтобы ~455 КиБ аналитики не били по LCP/TBT.
         dataLayer инициализируется сразу: события из приложения очередятся и обработаются
         при загрузке GTM. Отключён на localhost, чтобы тесты не слали события.

         Метрика грузится СВОИМ скриптом, а не тегом внутри GTM: у части российских
         провайдеров googletagmanager.com режется по TLS, и вместе с GTM пропадала
         единственная доступная в РФ аналитика (mc.yandex.ru при этом открывается).
         Парный тег `cHTML - YM - base tag` в контейнере поставлен на паузу. -->
    <script>(function(){var h=location.hostname;if(h==='localhost'||h==='127.0.0.1'||h==='::1'||h.endsWith('.local'))return;
    var w=window,d=document,l='dataLayer',i='GTM-N9THMZKK',ymId=110968609;w[l]=w[l]||[];
    var loaded=false,evts=['scroll','pointerdown','touchstart','keydown'],t;
    function inject(src){var f=d.getElementsByTagName('script')[0],j=d.createElement('script');
      j.async=true;j.src=src;f.parentNode.insertBefore(j,f);}
    function load(){if(loaded)return;loaded=true;clearTimeout(t);
      evts.forEach(function(e){w.removeEventListener(e,load)});
      w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
      inject('https://www.googletagmanager.com/gtm.js?id='+i);
      /* w.ym уже определён — счётчик подняли тегом GTM, второй init Метрика игнорирует */
      if(w.ym)return;
      w.ym=function(){(w.ym.a=w.ym.a||[]).push(arguments)};w.ym.l=1*new Date();
      inject('https://mc.yandex.ru/metrika/tag.js?id='+ymId);
      w.ym(ymId,'init',{ssr:true,webvisor:true,clickmap:true,ecommerce:'dataLayer',
        referrer:d.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});}
    w.__gtmLoad=load; /* форс-загрузка для критичных событий (purchase) */
    evts.forEach(function(e){w.addEventListener(e,load,{once:true,passive:true})});
    t=setTimeout(load,3500);})();</script>
    <!-- End Google Tag Manager + Яндекс.Метрика -->
