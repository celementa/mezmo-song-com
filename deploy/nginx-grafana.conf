# Grafana для mezmo-song.com. Включается в server-блок 443:
#   include /etc/nginx/snippets/mezmo-grafana.conf;
# Grafana слушает только 127.0.0.1:3000, снаружи — HTTPS и форма входа Grafana.
location = /grafana {
    return 301 /grafana/;
}

location /grafana/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Basic Auth — только для nginx. Если пробросить Authorization в Grafana,
    # она попытается аутентифицировать пользователя grafana (его там нет) и
    # вернёт 401 ещё до формы логина.
    proxy_set_header Authorization "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
}
