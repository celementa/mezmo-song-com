# Вставляется в server-блок mezmo-song.com (443) рядом с `location /`.
# /api и /admin — Go-бэкенд (deploy/mezmo-com.service), остальное — статика.
#
# X-Forwarded-For ПЕРЕЗАПИСЫВАЕТСЯ адресом клиента, а не дописывается:
# по нему сервер проверяет, что уведомление пришло с IP UnitPay, и считает
# квоты бесплатных генераций. Присланный клиентом заголовок доверять нельзя.
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}

location /admin {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    proxy_pass http://127.0.0.1:8080;
}
